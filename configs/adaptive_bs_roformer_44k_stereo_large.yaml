model_type: adaptive_bs_roformer
model:
  dim: 256
  depth: 6
  max_speakers: 5
  decoder_heads: 8
  memory_frames: 256
  stereo: true
  heads: 8
  dim_head: 32
  time_transformer_depth: 2
  freq_transformer_depth: 2
  attn_dropout: 0.0
  ff_dropout: 0.0
  stft_n_fft: 2048
  stft_win_length: 2048
  stft_hop_length: 512
  freqs_per_bands: [4, 4, 4, 4, 4, 4, 4, 4, 8, 8, 8, 8, 8, 8, 8, 8, 16, 16, 16, 16, 16, 16, 16, 16, 32, 32, 32, 32, 32, 32, 32, 32, 64, 64, 64, 64, 64, 64, 64, 64, 33]
  mask_estimator_depth: 2
  mlp_expansion_factor: 4
audio:
  sample_rate: 44100
  duration: 4.0
  channels: 2
training:
  seed: 1145
  batch_size: 1
  steps_per_epoch: 1000
  max_steps: 20000
  lr: 0.0001
  weight_decay: 0.0001
  amp: true
  gradient_clip: 5.0
  validate_every: 500
  save_every: 500
  validation_samples: 24
  log_every: 10
augmentation:
  pitch_probability: 0.2
  pitch_semitones: 2.0
  eq_probability: 0.6
  eq_db: 6.0
  reverb_probability: 0.4
  max_rt60: 0.6
  max_itd_ms: 0.7
  noise_probability: 0.5
  min_active_fraction: 0.5
  empty_weight: 0.15
loss:
  fft_sizes: [1024, 2048]  # the 512 band cost ~30% of loss time for little gain
  spectral_weight: 0.5
  existence_weight: 2.0
  silence_weight: 0.1
